<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Libro</title>
</head>
<body>

<h2>Registrar Libro</h2>

<form id="formLibro">
    <label>ID:</label>
    <input type="number" id="id" required><br><br>

    <label>Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label>Autor:</label>
    <input type="text" id="autor" required><br><br>

    <label>Año:</label>
    <input type="number" id="anio" required><br><br>

    <label>ISBN:</label>
    <input type="text" id="isbn" required><br><br>

    <button type="submit">Guardar</button>
    <button onclick="location.href='index.html'" type="button">Volver</button>
</form>

<script>
    document.getElementById("formLibro").addEventListener("submit", function(e) {
        e.preventDefault();

        const libro = {
            id: document.getElementById("id").value,
            nombre: document.getElementById("nombre").value,
            autor: document.getElementById("autor").value,
            anio: document.getElementById("anio").value,
            isbn: document.getElementById("isbn").value
        };

        fetch("/api/libros", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(libro)
        }).then(r => {
            alert("Libro registrado");
            location.href = "index.html";
        });
    });
</script>

</body>
</html>
