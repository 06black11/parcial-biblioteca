<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Recursos de la Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        button { padding: 6px 12px; margin-right: 5px; }
        h1 { text-align: center; }
        .buttons-container { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<h1>Gestión de Recursos de la Biblioteca</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Fecha de Registro</th>
            <th>Tipo</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla-recursos">
    </tbody>
</table>

<div class="buttons-container">
<button onclick="location.href='nuevo-libro.html'">Nuevo Libro</button>
<button onclick="location.href='nuevo-periodico.html'">Nuevo Periódico</button>
<button onclick="location.href='nuevo-computador.html'">Nuevo Computador</button>

</div>

<script>
    function cargarRecursos() {
        fetch('/api/recursos')
            .then(r => r.json())
            .then(data => {
                let tbody = document.getElementById("tabla-recursos");
                tbody.innerHTML = "";

                data.forEach(r => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${r.id}</td>
                            <td>${r.nombre}</td>
                            <td>${r.fechaRegistro}</td>
                            <td>${r.tipoRecurso}</td>
                            <td>
                                <button onclick="modificar(${r.id}, '${r.tipoRecurso}')">Modificar</button>
                                <button onclick="eliminar(${r.id}, '${r.tipoRecurso}')">Eliminar</button>
                            </td>
                        </tr>`;
                });
            });
    }

    function modificar(id, tipo) {
        alert("Modificar " + tipo + " con ID " + id);
    }

    function eliminar(id, tipo) {
        if (confirm("¿Eliminar " + tipo + " con ID " + id + "?")) {
            fetch(`/api/${tipo.toLowerCase()}/${id}`, { method: "DELETE" })
                .then(_ => cargarRecursos());
        }
    }

    function crear(tipo) {
        alert("Crear nuevo " + tipo);
    }

    cargarRecursos();
</script>

</body>
</html>
