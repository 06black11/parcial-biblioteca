<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Periódico</title>
</head>
<body>

<h2>Registrar Periódico</h2>

<form id="formPeriodico">
    <label>ID:</label>
    <input type="number" id="id" required><br><br>

    <label>Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label>Editorial:</label>
    <input type="text" id="editorial" required><br><br>

    <label>Año:</label>
    <input type="number" id="anio" required><br><br>

    <button type="submit">Guardar</button>
    <button onclick="location.href='index.html'" type="button">Volver</button>
</form>

<script>
    document.getElementById("formPeriodico").addEventListener("submit", function(e) {
        e.preventDefault();

        const periodico = {
            id: document.getElementById("id").value,
            nombre: document.getElementById("nombre").value,
            editorial: document.getElementById("editorial").value,
            anio: document.getElementById("anio").value
        };

        fetch("/api/periodicos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(periodico)
        }).then(r => {
            alert("Periódico registrado");
            location.href = "index.html";
        });
    });
</script>

</body>
</html>
