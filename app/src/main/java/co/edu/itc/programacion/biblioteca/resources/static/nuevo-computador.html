<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Computador</title>
</head>
<body>

<h2>Registrar Computador</h2>

<form id="formComputador">
    <label>ID:</label>
    <input type="number" id="id" required><br><br>

    <label>Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label>Marca:</label>
    <input type="text" id="marca" required><br><br>

    <label>Modelo:</label>
    <input type="text" id="modelo" required><br><br>

    <label>Tipo:</label>
    <input type="text" id="tipo" required><br><br>

    <button type="submit">Guardar</button>
    <button onclick="location.href='index.html'" type="button">Volver</button>
</form>

<script>
    document.getElementById("formComputador").addEventListener("submit", function(e) {
        e.preventDefault();

        const computador = {
            id: document.getElementById("id").value,
            nombre: document.getElementById("nombre").value,
            marca: document.getElementById("marca").value,
            modelo: document.getElementById("modelo").value,
            tipo: document.getElementById("tipo").value
        };

        fetch("/api/computadores", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(computador)
        }).then(r => {
            alert("Computador registrado");
            location.href = "index.html";
        });
    });
</script>

</body>
</html>
